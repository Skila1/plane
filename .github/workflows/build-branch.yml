name: Build and Push Images

on:
  workflow_dispatch:
    inputs:
      arm64:
        description: "Build for ARM64 architecture"
        required: false
        default: false
        type: boolean
      aio_build:
        description: "Build for AIO docker image"
        required: false
        default: false
        type: boolean
  push:
    branches:
      - preview

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: skila1
  GH_REPO: Skila1/Plane

jobs:
  build_setup:
    name: Build Setup
    runs-on: ubuntu-22.04
    outputs:
      buildx_platforms: ${{ steps.set_env.outputs.BUILDX_PLATFORMS }}
      release_version: ${{ steps.version.outputs.VERSION }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: set_env
        name: Set Build Platforms
        run: |
          if [ "${{ github.event.inputs.arm64 }}" == "true" ]; then
            echo "BUILDX_PLATFORMS=linux/amd64,linux/arm64" >> $GITHUB_OUTPUT
          else
            echo "BUILDX_PLATFORMS=linux/amd64" >> $GITHUB_OUTPUT
          fi

      - id: version
        name: Auto-increment Version
        run: |
          LATEST_TAG=$(git tag -l 'v*' --sort=-v:refname | head -n1)
          if [ -z "$LATEST_TAG" ]; then
            NEW_VERSION="v1.0.0"
          else
            MAJOR=$(echo "$LATEST_TAG" | sed 's/v//' | cut -d. -f1)
            MINOR=$(echo "$LATEST_TAG" | sed 's/v//' | cut -d. -f2)
            PATCH=$(echo "$LATEST_TAG" | sed 's/v//' | cut -d. -f3)
            PATCH=$((PATCH + 1))
            NEW_VERSION="v${MAJOR}.${MINOR}.${PATCH}"
          fi
          echo "VERSION=${NEW_VERSION}" >> $GITHUB_OUTPUT
          echo "Auto-incremented version: ${NEW_VERSION}"

      - name: Create Git Tag
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag ${{ steps.version.outputs.VERSION }}
          git push origin ${{ steps.version.outputs.VERSION }}

  build_push_web:
    name: Build-Push Web
    runs-on: ubuntu-22.04
    needs: [build_setup]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/web/Dockerfile.web
          platforms: ${{ needs.build_setup.outputs.buildx_platforms }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/plane-frontend:${{ needs.build_setup.outputs.release_version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/plane-frontend:latest

  build_push_space:
    name: Build-Push Space
    runs-on: ubuntu-22.04
    needs: [build_setup]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/space/Dockerfile.space
          platforms: ${{ needs.build_setup.outputs.buildx_platforms }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/plane-space:${{ needs.build_setup.outputs.release_version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/plane-space:latest

  build_push_admin:
    name: Build-Push Admin
    runs-on: ubuntu-22.04
    needs: [build_setup]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/admin/Dockerfile.admin
          platforms: ${{ needs.build_setup.outputs.buildx_platforms }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/plane-admin:${{ needs.build_setup.outputs.release_version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/plane-admin:latest

  build_push_live:
    name: Build-Push Live
    runs-on: ubuntu-22.04
    needs: [build_setup]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/live/Dockerfile.live
          platforms: ${{ needs.build_setup.outputs.buildx_platforms }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/plane-live:${{ needs.build_setup.outputs.release_version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/plane-live:latest

  build_push_api:
    name: Build-Push API
    runs-on: ubuntu-22.04
    needs: [build_setup]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: ./apps/api
          file: ./apps/api/Dockerfile.api
          platforms: ${{ needs.build_setup.outputs.buildx_platforms }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/plane-backend:${{ needs.build_setup.outputs.release_version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/plane-backend:latest

  build_push_proxy:
    name: Build-Push Proxy
    runs-on: ubuntu-22.04
    needs: [build_setup]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: ./apps/proxy
          file: ./apps/proxy/Dockerfile.ce
          platforms: ${{ needs.build_setup.outputs.buildx_platforms }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/plane-proxy:${{ needs.build_setup.outputs.release_version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/plane-proxy:latest

  publish_release:
    name: Publish Release
    runs-on: ubuntu-22.04
    needs:
      - build_setup
      - build_push_web
      - build_push_space
      - build_push_admin
      - build_push_live
      - build_push_api
      - build_push_proxy
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ needs.build_setup.outputs.release_version }}
          name: ${{ needs.build_setup.outputs.release_version }}
          generate_release_notes: true
